# aioconf: fan curves for the NZXT Kraken 2023 and the motherboard fan chip.
#
# These values were measured and tuned on one machine: an i9-14900K with a
# 3-fan Kraken radiator as top exhaust, in an NZXT H6 Flow with 3 front intake
# fans on motherboard header 1. See README.md, "Tuning", for the data. They
# are a reasonable start for similar builds; check yours with `aioconf watch`.
#
# Syntax
#   pump = ...  /  fan = ...       Kraken channels, following liquid temperature
#   board.pwmN = [SENSOR] ...      motherboard header N, following SENSOR
# A curve is pairs of temperature in °C and duty in %. One number is a fixed
# duty (Kraken only). Leave a line out to leave that fan alone.
#
# Apply changes with: sudo aioconf apply

# Kraken pump. Pump speed sets how far the CPU runs above the liquid during a
# burst: about 66 °C at 20%, 53 °C at 35%, 48 °C at 50%, and no better above
# 70%. The floor rises with the liquid temperature, so a summer room gets
# more pump and bursts keep about 15 °C of headroom below the 100 °C limit.
pump = 26 30  32 40  38 55  44 80  48 100

# Kraken radiator fans. They decide where the liquid settles under sustained
# load. At 253 W in a 22 °C room the liquid settles near 36 °C on this curve,
# and near 41 °C in a 32 °C room, both far from throttling. Below 35% these
# fans hold their minimum speed of about 735 rpm.
fan = 30 25  34 35  38 50  42 75  46 100

# Front intake fans on header 1. They follow CPUTIN, the socket and
# power-delivery sensor. It climbs about 0.4 °C per second under load, so a
# short burst only nudges these fans, while sustained load brings them up
# with the radiator fans. They stop below about 30%, so the floor is 40%.
board.pwm1 = CPUTIN  40 40  50 50  60 70  68 100
