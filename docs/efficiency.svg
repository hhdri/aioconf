<text class="tick" x="525.1" y="382" text-anchor="middle">300</text>
<text class="axis-label" x="326.0" y="406" text-anchor="middle">Package power (W)</text>
<text class="axis-label" transform="translate(16 228.0) rotate(-90)" text-anchor="middle">Work per joule (% of 253 W)</text>
