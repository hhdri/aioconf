<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Kraken curves in /etc/aioconf.conf. Duty the firmware runs at each liquid temperature. 59 °C forces 100% as a failsafe.">
<style>
  .surface { fill: #fcfcfb; }
