<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Sustained 253 W: radiator fan duty vs temperature. Pump at 100%, each step held until the liquid settled. Fans bottom out near 735 rpm below 35%.">
<style>
  .surface { fill: #fcfcfb; }
  .title { fill: #0b0b0b; font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .sub { fill: #52514e; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .tick { fill: #898781; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  .axis-label { fill: #52514e; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .label { fill: #0b0b0b; font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .label-muted { fill: #52514e; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .base { stroke: #c3c2b7; stroke-width: 1; }
  .ref { stroke: #898781; stroke-width: 1; }
  .s1-line { stroke: #2a78d6; fill: none; }
  .s2-line { stroke: #eb6834; fill: none; }
  .s3-line { stroke: #1baf7a; fill: none; }
  .crit-line { stroke: #d03b3b; fill: none; }
  .crit-dot { fill: #d03b3b; }
  .s1-dot { fill: #2a78d6; }
  .s2-dot { fill: #eb6834; }
  .ring { stroke: #fcfcfb; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .title, .label { fill: #f0efec; }
    .sub, .axis-label, .label-muted { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; }
    .base { stroke: #383835; }
    .s1-line { stroke: #3987e5; }
    .s2-line { stroke: #d95926; }
    .s3-line { stroke: #199e70; }
    .s1-dot { fill: #3987e5; }
    .s2-dot { fill: #d95926; }
    .ring { stroke: #1a1a19; }
  }
</style>
<rect class="surface" width="720" height="420" rx="8"/>
<text class="title" x="64" y="30">Sustained 253 W: radiator fan duty vs temperature</text>
<text class="sub" x="64" y="50">Pump at 100%, each step held until the liquid settled. Fans bottom out near 735 rpm below 35%.</text>
<line class="s2-line" x1="64" y1="70" x2="82" y2="70" stroke-width="2" stroke-linecap="round"/>
<text class="label-muted" x="88" y="74">Package</text>
<line class="s1-line" x1="172" y1="70" x2="190" y2="70" stroke-width="2" stroke-linecap="round"/>
<text class="label-muted" x="196" y="74">Liquid</text>
<line class="grid" x1="64" y1="364.0" x2="588" y2="364.0"/>
<text class="tick" x="56" y="368.0" text-anchor="end">20</text>
<line class="grid" x1="64" y1="300.0" x2="588" y2="300.0"/>
<text class="tick" x="56" y="304.0" text-anchor="end">40</text>
<line class="grid" x1="64" y1="236.0" x2="588" y2="236.0"/>
<text class="tick" x="56" y="240.0" text-anchor="end">60</text>
<line class="grid" x1="64" y1="172.0" x2="588" y2="172.0"/>
<text class="tick" x="56" y="176.0" text-anchor="end">80</text>
<line class="grid" x1="64" y1="108.0" x2="588" y2="108.0"/>
<text class="tick" x="56" y="112.0" text-anchor="end">100</text>
<line class="base" x1="64" y1="364" x2="588" y2="364"/>
<text class="tick" x="94.8" y="382" text-anchor="middle">25%</text>
<text class="tick" x="156.5" y="382" text-anchor="middle">35%</text>
<text class="tick" x="248.9" y="382" text-anchor="middle">50%</text>
<text class="tick" x="372.2" y="382" text-anchor="middle">70%</text>
<text class="tick" x="557.2" y="382" text-anchor="middle">100%</text>
<text class="axis-label" x="326.0" y="406" text-anchor="middle">Radiator fan duty (%)</text>
<text class="axis-label" transform="translate(16 228.0) rotate(-90)" text-anchor="middle">Temperature (°C)</text>
<line class="ref" x1="64" y1="108.0" x2="588" y2="108.0"/>
<text class="label-muted" x="596" y="112.0">Throttles at 100 °C</text>
<path class="s2-line" d="M94.8 162.4 L156.5 163.0 L248.9 182.6 L372.2 191.8 L557.2 200.2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="s2-dot ring" cx="94.8" cy="162.4" r="5" style="paint-order: stroke"/>
<circle class="s2-dot ring" cx="156.5" cy="163.0" r="5" style="paint-order: stroke"/>
<circle class="s2-dot ring" cx="248.9" cy="182.6" r="5" style="paint-order: stroke"/>
<circle class="s2-dot ring" cx="372.2" cy="191.8" r="5" style="paint-order: stroke"/>
<circle class="s2-dot ring" cx="557.2" cy="200.2" r="5" style="paint-order: stroke"/>
<text class="label-muted" x="567.2" y="204.2">Package</text>
<path class="s1-line" d="M94.8 300.0 L156.5 301.3 L248.9 320.2 L372.2 329.8 L557.2 338.4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="s1-dot ring" cx="94.8" cy="300.0" r="5" style="paint-order: stroke"/>
<circle class="s1-dot ring" cx="156.5" cy="301.3" r="5" style="paint-order: stroke"/>
<circle class="s1-dot ring" cx="248.9" cy="320.2" r="5" style="paint-order: stroke"/>
<circle class="s1-dot ring" cx="372.2" cy="329.8" r="5" style="paint-order: stroke"/>
<circle class="s1-dot ring" cx="557.2" cy="338.4" r="5" style="paint-order: stroke"/>
<text class="label-muted" x="567.2" y="342.4">Liquid</text>
</svg>
